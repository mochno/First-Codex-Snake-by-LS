<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Basic Snake Game</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --grid: #111827;
      --snake: #22c55e;
      --food: #ef4444;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Trebuchet MS", Verdana, sans-serif;
      background: radial-gradient(circle at top, #1e293b 0%, #020617 70%);
      color: var(--text);
      padding: 16px;
    }

    .game-wrap {
      width: min(92vw, 520px);
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 12px;
      padding: 16px;
      backdrop-filter: blur(4px);
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 8px;
    }

    .status {
      font-weight: 700;
      font-size: 1rem;
    }

    button {
      border: 0;
      border-radius: 8px;
      background: var(--snake);
      color: #052e16;
      font-weight: 700;
      padding: 8px 12px;
      cursor: pointer;
    }

    .hint {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    canvas {
      width: 100%;
      aspect-ratio: 1;
      display: block;
      background: var(--grid);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 8px;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <main class="game-wrap">
    <div class="top-bar">
      <div class="status" id="status">Score: 0</div>
      <button id="restartBtn" type="button">Restart</button>
    </div>
    <canvas id="board" width="400" height="400" aria-label="Snake game board"></canvas>
    <p class="hint">Use arrow keys or WASD. Press Space to pause.</p>
  </main>

  <script>
    const board = document.getElementById("board");
    const ctx = board.getContext("2d");
    const statusText = document.getElementById("status");
    const restartBtn = document.getElementById("restartBtn");

    const gridSize = 20;
    const tileSize = board.width / gridSize;
    const speedMs = 120;

    let snake;
    let direction;
    let queuedDirection;
    let food;
    let score;
    let gameLoopId;
    let isPaused;
    let isGameOver;

    function randomCell() {
      return {
        x: Math.floor(Math.random() * gridSize),
        y: Math.floor(Math.random() * gridSize)
      };
    }

    function placeFood() {
      let nextFood = randomCell();
      while (snake.some((part) => part.x === nextFood.x && part.y === nextFood.y)) {
        nextFood = randomCell();
      }
      food = nextFood;
    }

    function resetGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      direction = { x: 1, y: 0 };
      queuedDirection = { ...direction };
      score = 0;
      isPaused = false;
      isGameOver = false;
      placeFood();
      updateStatus();
      clearInterval(gameLoopId);
      gameLoopId = setInterval(step, speedMs);
      draw();
    }

    function updateStatus() {
      if (isGameOver) {
        statusText.textContent = `Game Over - Score: ${score}`;
        return;
      }
      if (isPaused) {
        statusText.textContent = `Paused - Score: ${score}`;
        return;
      }
      statusText.textContent = `Score: ${score}`;
    }

    function isOpposite(next, current) {
      return next.x === -current.x && next.y === -current.y;
    }

    function queueDirection(next) {
      if (isGameOver || isPaused) {
        return;
      }
      if (isOpposite(next, direction)) {
        return;
      }
      queuedDirection = next;
    }

    function step() {
      if (isPaused || isGameOver) {
        return;
      }

      direction = queuedDirection;

      const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
      };

      const hitWall = head.x < 0 || head.x >= gridSize || head.y < 0 || head.y >= gridSize;
      const hitSelf = snake.some((part) => part.x === head.x && part.y === head.y);

      if (hitWall || hitSelf) {
        isGameOver = true;
        clearInterval(gameLoopId);
        updateStatus();
        draw();
        return;
      }

      snake.unshift(head);

      const ateFood = head.x === food.x && head.y === food.y;
      if (ateFood) {
        score += 1;
        placeFood();
      } else {
        snake.pop();
      }

      updateStatus();
      draw();
    }

    function drawCell(cell, color) {
      ctx.fillStyle = color;
      ctx.fillRect(cell.x * tileSize, cell.y * tileSize, tileSize, tileSize);
    }

    function drawGrid() {
      ctx.strokeStyle = "rgba(148, 163, 184, 0.1)";
      ctx.lineWidth = 1;
      for (let i = 0; i <= gridSize; i += 1) {
        const pos = i * tileSize;
        ctx.beginPath();
        ctx.moveTo(pos, 0);
        ctx.lineTo(pos, board.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, pos);
        ctx.lineTo(board.width, pos);
        ctx.stroke();
      }
    }

    function draw() {
      ctx.clearRect(0, 0, board.width, board.height);
      drawGrid();

      drawCell(food, getComputedStyle(document.documentElement).getPropertyValue("--food").trim());

      snake.forEach((part, index) => {
        drawCell(
          part,
          index === 0
            ? "#4ade80"
            : getComputedStyle(document.documentElement).getPropertyValue("--snake").trim()
        );
      });
    }

    function togglePause() {
      if (isGameOver) {
        return;
      }
      isPaused = !isPaused;
      updateStatus();
    }

    document.addEventListener("keydown", (event) => {
      switch (event.key.toLowerCase()) {
        case "arrowup":
        case "w":
          queueDirection({ x: 0, y: -1 });
          break;
        case "arrowdown":
        case "s":
          queueDirection({ x: 0, y: 1 });
          break;
        case "arrowleft":
        case "a":
          queueDirection({ x: -1, y: 0 });
          break;
        case "arrowright":
        case "d":
          queueDirection({ x: 1, y: 0 });
          break;
        case " ":
          event.preventDefault();
          togglePause();
          break;
        default:
          return;
      }
      event.preventDefault();
    });

    restartBtn.addEventListener("click", resetGame);

    resetGame();
  </script>
</body>
</html>
