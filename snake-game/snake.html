<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake — Neon Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050a18;
      --panel: rgba(10, 18, 40, 0.92);
      --grid: #080e20;
      --snake-head: #4ade80;
      --snake-tail: #065f26;
      --food: #f43f5e;
      --food-glow: rgba(244, 63, 94, 0.5);
      --accent: #22c55e;
      --accent-glow: rgba(34, 197, 94, 0.35);
      --text: #e2e8f0;
      --muted: #64748b;
      --gold: #fbbf24;
    }

    * { box-sizing: border-box; margin: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      overflow: hidden;
    }

    /* Animated background stars */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(1.5px 1.5px at 10% 20%, rgba(255,255,255,0.25) 50%, transparent 100%),
        radial-gradient(1px 1px at 30% 65%, rgba(255,255,255,0.15) 50%, transparent 100%),
        radial-gradient(1.5px 1.5px at 55% 15%, rgba(255,255,255,0.2) 50%, transparent 100%),
        radial-gradient(1px 1px at 70% 80%, rgba(255,255,255,0.18) 50%, transparent 100%),
        radial-gradient(1.5px 1.5px at 85% 40%, rgba(255,255,255,0.22) 50%, transparent 100%),
        radial-gradient(1px 1px at 15% 85%, rgba(255,255,255,0.12) 50%, transparent 100%),
        radial-gradient(1.5px 1.5px at 45% 45%, rgba(255,255,255,0.16) 50%, transparent 100%),
        radial-gradient(1px 1px at 90% 10%, rgba(255,255,255,0.2) 50%, transparent 100%),
        radial-gradient(ellipse at 30% 60%, rgba(34,197,94,0.06) 0%, transparent 60%),
        radial-gradient(ellipse at 70% 30%, rgba(59,130,246,0.05) 0%, transparent 60%);
      pointer-events: none;
      animation: drift 30s ease-in-out infinite alternate;
    }

    @keyframes drift {
      from { transform: translateY(0); }
      to { transform: translateY(-12px); }
    }

    .game-wrap {
      width: min(96vw, 660px);
      background: var(--panel);
      border: 1px solid rgba(148, 163, 184, 0.12);
      border-radius: 16px;
      padding: 20px;
      backdrop-filter: blur(12px);
      box-shadow:
        0 0 60px rgba(34,197,94,0.06),
        0 24px 48px rgba(0,0,0,0.4);
      position: relative;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 8px;
    }

    .scores {
      display: flex;
      gap: 16px;
      align-items: baseline;
    }

    .score-label {
      font-family: 'Orbitron', monospace;
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: 0.5px;
    }

    .score-value {
      color: var(--accent);
      text-shadow: 0 0 12px var(--accent-glow);
    }

    .hi-label {
      font-family: 'Orbitron', monospace;
      font-weight: 500;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.5px;
    }

    .hi-value { color: var(--gold); }

    button {
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #052e16;
      font-family: 'Orbitron', monospace;
      font-weight: 700;
      font-size: 0.7rem;
      letter-spacing: 1px;
      padding: 8px 14px;
      cursor: pointer;
      text-transform: uppercase;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 16px var(--accent-glow);
    }

    button:active { transform: scale(0.97); }

    .canvas-wrap {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(148, 163, 184, 0.1);
    }

    canvas {
      width: 100%;
      aspect-ratio: 1;
      display: block;
      background: var(--grid);
      image-rendering: auto;
    }

    /* Game over overlay */
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(5, 10, 24, 0.82);
      backdrop-filter: blur(6px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      border-radius: 10px;
    }

    .overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .overlay h2 {
      font-family: 'Orbitron', monospace;
      font-weight: 900;
      font-size: 1.8rem;
      color: var(--food);
      text-shadow: 0 0 24px rgba(244, 63, 94, 0.5);
      margin-bottom: 6px;
      letter-spacing: 2px;
    }

    .overlay .final-score {
      font-family: 'Orbitron', monospace;
      font-size: 1rem;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .overlay .final-score span {
      color: var(--accent);
    }

    .overlay button {
      font-size: 0.8rem;
      padding: 10px 24px;
    }

    .hint {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.8rem;
      text-align: center;
      letter-spacing: 0.3px;
    }

    .hint label {
      margin-left: 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
    }

    .hint input[type="checkbox"] {
      accent-color: #22c55e;
      width: 14px;
      height: 14px;
    }

    .hint input[type="text"] {
      margin-left: 10px;
      background: rgba(148,163,184,0.12);
      border: 1px solid rgba(148,163,184,0.2);
      color: var(--text);
      border-radius: 6px;
      padding: 4px 8px;
      font-family: 'Outfit', sans-serif;
      font-size: 0.78rem;
      width: 130px;
    }

    .hint kbd {
      background: rgba(148,163,184,0.12);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Orbitron', monospace;
      font-size: 0.65rem;
      border: 1px solid rgba(148,163,184,0.15);
    }

    /* Floating score popup */
    .score-pop {
      position: absolute;
      font-family: 'Orbitron', monospace;
      font-weight: 900;
      font-size: 1.1rem;
      color: var(--accent);
      text-shadow: 0 0 8px var(--accent-glow);
      pointer-events: none;
      animation: popUp 0.7s ease-out forwards;
    }

    @keyframes popUp {
      0%   { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-40px) scale(1.3); }
    }

    /* Screen shake */
    .shake {
      animation: shakeAnim 0.35s ease-out;
    }

    @keyframes shakeAnim {
      0%, 100% { transform: translate(0); }
      15% { transform: translate(-6px, 3px); }
      30% { transform: translate(5px, -4px); }
      45% { transform: translate(-4px, 2px); }
      60% { transform: translate(3px, -2px); }
      75% { transform: translate(-2px, 1px); }
    }
  </style>
</head>
<body>
  <main class="game-wrap" id="gameWrap">
    <div class="top-bar">
      <div class="scores">
        <div class="score-label">
          <span class="score-value" id="score">0</span>
        </div>
        <div class="hi-label">
          HI <span class="hi-value" id="hiScore">0</span> by <span class="hi-value" id="hiName">Player</span>
        </div>
      </div>
      <button id="restartBtn" type="button">Restart</button>
    </div>

    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="board" width="800" height="800" aria-label="Snake game board"></canvas>
      <div class="overlay" id="overlay">
        <h2>GAME OVER</h2>
        <div class="final-score">Score: <span id="finalScore">0</span></div>
        <button id="overlayRestart" type="button">Play Again</button>
      </div>
    </div>

    <p class="hint">
      <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to move &nbsp;·&nbsp; <kbd>Space</kbd> pause
      <label><input id="saveHiToggle" type="checkbox" checked /> Save HI</label>
      <input id="playerName" type="text" maxlength="20" placeholder="Player name" />
    </p>
  </main>

  <script>
    /* ── Setup ─────────────────────────────────────── */
    const board   = document.getElementById("board");
    const ctx     = board.getContext("2d");
    const scoreEl = document.getElementById("score");
    const hiEl    = document.getElementById("hiScore");
    const hiNameEl= document.getElementById("hiName");
    const overlay = document.getElementById("overlay");
    const finalEl = document.getElementById("finalScore");
    const wrap    = document.getElementById("canvasWrap");
    const gameWrap= document.getElementById("gameWrap");
    const saveHiToggle = document.getElementById("saveHiToggle");
    const playerNameInput = document.getElementById("playerName");

    const GRID = 40;
    const TILE = board.width / GRID;
    const APPLE_COUNT = 3;
    const BASE_STEP_MS = 1000;
    const SPEEDUP_PER_APPLE = 0.9;
    const SLOWDOWN_ON_MEDKIT = 1.15;
    const MIN_STEP_MS = 50;
    const MAX_STEP_MS = 3000;
    const RED_CROSS_LIFETIME_MS = 10000;
    const RED_CROSS_SPAWN_CHANCE = 0.025;
    const HI_SCORE_KEY = "snake_neon_hi_score";
    const HI_NAME_KEY = "snake_neon_hi_name";

    let snake, dir, qDir, foods = [], score, hiScore = 0, hiName = "Player";
    let stepMs = BASE_STEP_MS;
    let loopId, paused, dead;
    let particles = [];
    let foodPulse = 0;
    let animFrame;
    let bounceCountdown = 0; // steps until forced random direction change after bounce
    let medkit = null;

    /* ── Particles ─────────────────────────────────── */
    // Spawn radial particles around a board cell for hit/eat effects.
    function spawnParticles(x, y, color, count = 12) {
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 / count) * i + Math.random() * 0.4;
        const speed = 1.5 + Math.random() * 3;
        particles.push({
          x: x * TILE + TILE / 2,
          y: y * TILE + TILE / 2,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1,
          decay: 0.02 + Math.random() * 0.02,
          size: 2 + Math.random() * 3,
          color
        });
      }
    }

    // Advance particle movement and remove expired particles.
    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.96;
        p.vy *= 0.96;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    // Draw all active particles with glow and fade.
    function drawParticles() {
      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }

    /* ── Floating +1 ───────────────────────────────── */
    // Show floating "+1" text at a given board cell.
    function showScorePop(cellX, cellY) {
      const pop = document.createElement("div");
      pop.className = "score-pop";
      pop.textContent = "+1";
      const rect = board.getBoundingClientRect();
      const scale = rect.width / board.width;
      pop.style.left = (cellX * TILE + TILE / 2) * scale + "px";
      pop.style.top  = (cellY * TILE) * scale + "px";
      wrap.appendChild(pop);
      pop.addEventListener("animationend", () => pop.remove());
    }

    // Show floating custom status text (e.g. SLOW) at a board cell.
    function showTextPop(cellX, cellY, text, color = "#f87171") {
      const pop = document.createElement("div");
      pop.className = "score-pop";
      pop.textContent = text;
      pop.style.color = color;
      pop.style.textShadow = `0 0 8px ${color}`;
      const rect = board.getBoundingClientRect();
      const scale = rect.width / board.width;
      pop.style.left = (cellX * TILE + TILE / 2) * scale + "px";
      pop.style.top  = (cellY * TILE) * scale + "px";
      wrap.appendChild(pop);
      pop.addEventListener("animationend", () => pop.remove());
    }

    /* ── Screen shake ──────────────────────────────── */
    // Trigger a short container shake for collision feedback.
    function screenShake() {
      gameWrap.classList.add("shake");
      gameWrap.addEventListener("animationend", () => gameWrap.classList.remove("shake"), { once: true });
    }

    /* ── Helpers ────────────────────────────────────── */
    // Return a random board coordinate.
    function randCell() {
      return { x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID) };
    }

    // Place one apple on a free cell.
    function placeOneFood() {
      let tries = 0;
      while (tries < 400) {
        const f = randCell();
        const overlapFood = foods.some(a => a.x === f.x && a.y === f.y);
        if (!snake.some(s => s.x === f.x && s.y === f.y) && !overlapFood && (!medkit || medkit.x !== f.x || medkit.y !== f.y)) {
          foods.push(f);
          return;
        }
        tries++;
      }
    }

    // Keep target number of apples active for faster gameplay.
    function ensureFoodsCount() {
      while (foods.length < APPLE_COUNT) placeOneFood();
    }

    // Check whether a cell is free of snake, food, and medkit.
    function isFreeCell(x, y) {
      if (snake.some(s => s.x === x && s.y === y)) return false;
      if (foods.some(a => a.x === x && a.y === y)) return false;
      if (medkit && medkit.x === x && medkit.y === y) return false;
      return true;
    }

    // Spawn the slowdown medkit on a free cell with expiration timestamp.
    function placeMedkit() {
      let tries = 0;
      while (tries < 400) {
        const c = randCell();
        if (isFreeCell(c.x, c.y)) {
          medkit = {
            x: c.x,
            y: c.y,
            expiresAt: Date.now() + RED_CROSS_LIFETIME_MS
          };
          return;
        }
        tries++;
      }
      medkit = null;
    }

    // Randomly spawn medkit if one is not already active.
    function maybeSpawnMedkit() {
      if (medkit) return;
      if (Math.random() < RED_CROSS_SPAWN_CHANCE) placeMedkit();
    }

    // Remove medkit when its 10-second lifetime ends.
    function clearExpiredMedkit() {
      if (medkit && Date.now() > medkit.expiresAt) medkit = null;
    }

    // Apply and clamp movement interval, then restart step timer.
    function applyStepMs(nextMs) {
      stepMs = Math.max(MIN_STEP_MS, Math.min(MAX_STEP_MS, nextMs));
      if (!dead) {
        clearInterval(loopId);
        loopId = setInterval(step, stepMs);
      }
    }

    // Load saved high score from local storage.
    function loadSavedHi() {
      const raw = localStorage.getItem(HI_SCORE_KEY);
      const n = Number(raw);
      if (Number.isFinite(n) && n >= 0) hiScore = Math.floor(n);
      const savedName = localStorage.getItem(HI_NAME_KEY);
      if (savedName && savedName.trim()) hiName = savedName.trim();
    }

    // Persist high score only when user enabled Save HI.
    function persistHiIfEnabled() {
      if (!saveHiToggle.checked) return;
      localStorage.setItem(HI_SCORE_KEY, String(hiScore));
      localStorage.setItem(HI_NAME_KEY, hiName);
    }

    // Resolve active player name from input.
    function currentPlayerName() {
      const name = playerNameInput.value.trim();
      return name ? name.slice(0, 20) : "Player";
    }

    /* ── Game logic ────────────────────────────────── */
    // Start a new game round with base speed and fresh state.
    function reset() {
      snake = [{ x: 20, y: 20 }, { x: 19, y: 20 }, { x: 18, y: 20 }];
      dir  = { x: 1, y: 0 };
      qDir = { ...dir };
      score = 0;
      stepMs = BASE_STEP_MS;
      paused = false;
      dead = false;
      particles = [];
      bounceCountdown = 0;
      foods = [];
      medkit = null;
      ensureFoodsCount();
      overlay.classList.remove("visible");
      updateUI();
      clearInterval(loopId);
      loopId = setInterval(step, stepMs);
    }

    // Refresh score UI and maintain high score.
    function updateUI() {
      scoreEl.textContent = score;
      if (score > hiScore) {
        hiScore = score;
        hiName = currentPlayerName();
        persistHiIfEnabled();
      }
      hiEl.textContent = hiScore;
      hiNameEl.textContent = hiName;
    }

    function opposite(a, b) { return a.x === -b.x && a.y === -b.y; }

    // Queue a valid next movement direction.
    function queueDir(next) {
      if (dead || paused) return;
      if (opposite(next, dir)) return;
      qDir = next;
      bounceCountdown = 0; // player takes control, cancel auto-redirect
    }

    const ALL_DIRS = [
      { x: 1, y: 0 }, { x: -1, y: 0 },
      { x: 0, y: 1 }, { x: 0, y: -1 }
    ];

    function inBounds(x, y) { return x >= 0 && x < GRID && y >= 0 && y < GRID; }
    function hitsSnake(x, y) { return snake.some(s => s.x === x && s.y === y); }
    function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }

    // Pick a random safe direction used by bounce behavior.
    function pickRandomSafeDir(fromHead) {
      const tail = snake[snake.length - 1];
      const candidates = shuffle(ALL_DIRS.filter(d => {
        const nx = fromHead.x + d.x;
        const ny = fromHead.y + d.y;
        if (!inBounds(nx, ny)) return false;
        if (nx === tail.x && ny === tail.y) return true;
        return !hitsSnake(nx, ny);
      }));
      return candidates.length > 0 ? candidates[0] : null;
    }

    // Main game tick: movement, collisions, pickups, speed updates.
    function step() {
      if (paused || dead) return;
      clearExpiredMedkit();
      dir = qDir;

      /* ── Bounce countdown: force a random turn ── */
      if (bounceCountdown > 0) {
        bounceCountdown--;
        if (bounceCountdown === 0) {
          const rnd = pickRandomSafeDir(snake[0]);
          if (rnd) {
            dir = rnd;
            qDir = { ...dir };
            spawnParticles(snake[0].x, snake[0].y, "#a78bfa", 6); // purple flash for redirect
          }
        }
      }

      let head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      /* ── Wall bounce ─────────────────────────────── */
      if (!inBounds(head.x, head.y)) {
        spawnParticles(
          Math.max(0, Math.min(GRID - 1, head.x)),
          Math.max(0, Math.min(GRID - 1, head.y)),
          "#38bdf8", 8
        );

        const safeDir = pickRandomSafeDir(snake[0]);

        if (!safeDir) {
          dead = true;
          clearInterval(loopId);
          screenShake();
          spawnParticles(snake[0].x, snake[0].y, "#f43f5e", 20);
          finalEl.textContent = score;
          setTimeout(() => overlay.classList.add("visible"), 350);
          updateUI();
          return;
        }

        dir = safeDir;
        qDir = { ...dir };
        head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

        // Schedule another random direction change in 2-6 steps
        bounceCountdown = 2 + Math.floor(Math.random() * 5);
      }

      /* ── Self-collision ──────────────────────────── */
      if (hitsSnake(head.x, head.y)) {
        dead = true;
        clearInterval(loopId);
        screenShake();
        spawnParticles(head.x, head.y, "#f43f5e", 20);
        finalEl.textContent = score;
        setTimeout(() => overlay.classList.add("visible"), 350);
        updateUI();
        return;
      }

      snake.unshift(head);

      const eatenFoodIndex = foods.findIndex(a => head.x === a.x && head.y === a.y);
      if (eatenFoodIndex >= 0) {
        const eaten = foods[eatenFoodIndex];
        foods.splice(eatenFoodIndex, 1);
        score++;
        spawnParticles(eaten.x, eaten.y, "#4ade80", 18);
        spawnParticles(eaten.x, eaten.y, "#facc15", 12);
        showScorePop(eaten.x, eaten.y);
        applyStepMs(stepMs * SPEEDUP_PER_APPLE);
        ensureFoodsCount();
      } else {
        snake.pop();
      }

      if (medkit && head.x === medkit.x && head.y === medkit.y) {
        spawnParticles(medkit.x, medkit.y, "#f87171", 16);
        showTextPop(medkit.x, medkit.y, "SLOW", "#f87171");
        applyStepMs(stepMs * SLOWDOWN_ON_MEDKIT);
        medkit = null;
      }

      maybeSpawnMedkit();
      updateUI();
    }

    /* ── Drawing ───────────────────────────────────── */
    // Draw background grid lines.
    function drawGrid() {
      ctx.strokeStyle = "rgba(148, 163, 184, 0.05)";
      ctx.lineWidth = 1;
      for (let i = 0; i <= GRID; i++) {
        const p = i * TILE;
        ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, board.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(board.width, p); ctx.stroke();
      }
    }

    // Draw pulsing apple with glow.
    function drawFood() {
      foodPulse += 0.06;
      foods.forEach((apple, i) => {
        const phase = foodPulse + i * 0.9;
        const pulse = 1 + Math.sin(phase) * 0.15;
        const cx = apple.x * TILE + TILE / 2;
        const cy = apple.y * TILE + TILE / 2;
        const r  = (TILE / 2 - 2) * pulse;

        ctx.save();
        ctx.shadowColor = "rgba(244, 63, 94, 0.6)";
        ctx.shadowBlur  = 18 + Math.sin(phase) * 6;
        ctx.fillStyle   = "#f43f5e";
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.fillStyle = "rgba(255,255,255,0.35)";
        ctx.beginPath();
        ctx.arc(cx - r * 0.25, cy - r * 0.3, r * 0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }

    // Draw ambulance slowdown item.
    function drawMedkit() {
      if (!medkit) return;
      const x = medkit.x * TILE + 2;
      const y = medkit.y * TILE + 4;
      const w = TILE - 4;
      const h = TILE - 8;

      ctx.save();
      ctx.shadowColor = "rgba(248, 113, 113, 0.45)";
      ctx.shadowBlur = 10;

      // Body + cabin
      ctx.fillStyle = "#f8fafc";
      ctx.fillRect(x, y + h * 0.2, w * 0.65, h * 0.55);
      ctx.fillRect(x + w * 0.58, y + h * 0.32, w * 0.3, h * 0.43);

      // Red stripe
      ctx.fillStyle = "#ef4444";
      ctx.fillRect(x + w * 0.06, y + h * 0.42, w * 0.72, h * 0.14);

      // Medical cross
      ctx.fillStyle = "#dc2626";
      const cx = x + w * 0.34;
      const cy = y + h * 0.46;
      const arm = Math.max(2, w * 0.08);
      const thick = Math.max(2, w * 0.06);
      ctx.fillRect(cx - thick / 2, cy - arm, thick, arm * 2);
      ctx.fillRect(cx - arm, cy - thick / 2, arm * 2, thick);

      // Window + light
      ctx.fillStyle = "#93c5fd";
      ctx.fillRect(x + w * 0.66, y + h * 0.37, w * 0.17, h * 0.16);
      ctx.fillStyle = "#f87171";
      ctx.fillRect(x + w * 0.52, y + h * 0.12, w * 0.15, h * 0.08);

      // Wheels
      ctx.fillStyle = "#0f172a";
      ctx.beginPath();
      ctx.arc(x + w * 0.2, y + h * 0.82, h * 0.1, 0, Math.PI * 2);
      ctx.arc(x + w * 0.7, y + h * 0.82, h * 0.1, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Draw snake body, gradients, and head details.
    function drawSnake() {
      const len = snake.length;

      snake.forEach((seg, i) => {
        const t  = len > 1 ? i / (len - 1) : 0;
        const cx = seg.x * TILE + TILE / 2;
        const cy = seg.y * TILE + TILE / 2;

        // Interpolate head→tail color
        const r = Math.round(74 + (6 - 74) * t);
        const g = Math.round(222 + (95 - 222) * t);
        const b = Math.round(128 + (38 - 128) * t);
        const color = `rgb(${r},${g},${b})`;

        const radius = (TILE / 2 - 1) * (1 - t * 0.3); // taper towards tail

        ctx.save();
        if (i === 0) {
          ctx.shadowColor = "rgba(74,222,128,0.45)";
          ctx.shadowBlur  = 14;
        }
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // Connect segments with thick line for smooth body
      if (len > 1) {
        ctx.save();
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.lineWidth = TILE - 6;
        const grad = ctx.createLinearGradient(
          snake[0].x * TILE, snake[0].y * TILE,
          snake[len - 1].x * TILE, snake[len - 1].y * TILE
        );
        grad.addColorStop(0, "rgba(74,222,128,0.45)");
        grad.addColorStop(1, "rgba(6,95,38,0.2)");
        ctx.strokeStyle = grad;
        ctx.beginPath();
        ctx.moveTo(snake[0].x * TILE + TILE / 2, snake[0].y * TILE + TILE / 2);
        for (let i = 1; i < len; i++) {
          ctx.lineTo(snake[i].x * TILE + TILE / 2, snake[i].y * TILE + TILE / 2);
        }
        ctx.stroke();
        ctx.restore();
      }

      // Re-draw circles on top of the line
      snake.forEach((seg, i) => {
        const t  = len > 1 ? i / (len - 1) : 0;
        const cx = seg.x * TILE + TILE / 2;
        const cy = seg.y * TILE + TILE / 2;
        const r2 = Math.round(74 + (6 - 74) * t);
        const g2 = Math.round(222 + (95 - 222) * t);
        const b2 = Math.round(128 + (38 - 128) * t);
        const radius = (TILE / 2 - 1) * (1 - t * 0.3);
        ctx.fillStyle = `rgb(${r2},${g2},${b2})`;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fill();
      });

      // Eyes on head
      drawEyes(snake[0], dir);
    }

    // Draw eyes oriented to current movement direction.
    function drawEyes(head, d) {
      const cx = head.x * TILE + TILE / 2;
      const cy = head.y * TILE + TILE / 2;
      const eyeOff = TILE * 0.22;
      const eyeR   = TILE * 0.13;
      const pupilR  = TILE * 0.065;

      // Perpendicular to direction
      const px = -d.y;
      const py = d.x;

      // Two eye positions
      const eyes = [
        { x: cx + px * eyeOff + d.x * eyeOff * 0.6, y: cy + py * eyeOff + d.y * eyeOff * 0.6 },
        { x: cx - px * eyeOff + d.x * eyeOff * 0.6, y: cy - py * eyeOff + d.y * eyeOff * 0.6 }
      ];

      eyes.forEach(e => {
        // White
        ctx.fillStyle = "#e8f5e9";
        ctx.beginPath();
        ctx.arc(e.x, e.y, eyeR, 0, Math.PI * 2);
        ctx.fill();
        // Pupil (shifted toward direction)
        ctx.fillStyle = "#0a2e12";
        ctx.beginPath();
        ctx.arc(e.x + d.x * pupilR * 1.2, e.y + d.y * pupilR * 1.2, pupilR, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    /* ── Render loop ───────────────────────────────── */
    // Animation loop: draw scene and overlays every frame.
    function render() {
      ctx.clearRect(0, 0, board.width, board.height);

      // Subtle vignette
      const vig = ctx.createRadialGradient(
        board.width / 2, board.height / 2, board.width * 0.25,
        board.width / 2, board.height / 2, board.width * 0.7
      );
      vig.addColorStop(0, "transparent");
      vig.addColorStop(1, "rgba(0,0,0,0.3)");
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, board.width, board.height);

      drawGrid();
      drawFood();
      drawMedkit();
      drawSnake();
      updateParticles();
      drawParticles();

      // Pause text
      if (paused && !dead) {
        ctx.save();
        ctx.fillStyle = "rgba(5,10,24,0.6)";
        ctx.fillRect(0, 0, board.width, board.height);
        ctx.font = "900 42px 'Orbitron', monospace";
        ctx.fillStyle = "#e2e8f0";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.shadowColor = "rgba(34,197,94,0.4)";
        ctx.shadowBlur = 20;
        ctx.fillText("PAUSED", board.width / 2, board.height / 2);
        ctx.restore();
      }

      animFrame = requestAnimationFrame(render);
    }

    /* ── Input ─────────────────────────────────────── */
    document.addEventListener("keydown", e => {
      const k = e.key.toLowerCase();
      if (k === "arrowup"    || k === "w") { queueDir({ x: 0, y: -1 }); e.preventDefault(); }
      if (k === "arrowdown"  || k === "s") { queueDir({ x: 0, y: 1  }); e.preventDefault(); }
      if (k === "arrowleft"  || k === "a") { queueDir({ x: -1, y: 0 }); e.preventDefault(); }
      if (k === "arrowright"  || k === "d") { queueDir({ x: 1, y: 0  }); e.preventDefault(); }
      if (k === " ") {
        e.preventDefault();
        if (!dead) { paused = !paused; }
      }
    });

    document.getElementById("restartBtn").addEventListener("click", reset);
    document.getElementById("overlayRestart").addEventListener("click", reset);
    saveHiToggle.addEventListener("change", () => {
      if (!saveHiToggle.checked) return;
      persistHiIfEnabled();
    });
    playerNameInput.addEventListener("change", () => {
      hiName = currentPlayerName();
      hiNameEl.textContent = hiName;
      persistHiIfEnabled();
    });

    /* ── Start ─────────────────────────────────────── */
    loadSavedHi();
    hiEl.textContent = hiScore;
    hiNameEl.textContent = hiName;
    playerNameInput.value = hiName === "Player" ? "" : hiName;
    reset();
    render();
  </script>
</body>
</html>
