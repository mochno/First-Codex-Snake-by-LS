<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyclist Mobile</title>
  <style>
    :root {
      --bg: #07121f;
      --panel: rgba(10, 20, 36, 0.9);
      --grid: #0b1b2d;
      --text: #dbeafe;
      --muted: #93a7c2;
      --accent: #22d3ee;
      --accent2: #f43f5e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 100vw;
      height: 100dvh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 20% 10%, #13263f 0%, #030712 65%);
      color: var(--text);
      font-family: "Trebuchet MS", Verdana, sans-serif;
      padding: 0;
      overflow: hidden;
      touch-action: none;
    }
    .wrap {
      width: 100vw;
      height: 100dvh;
      background: var(--panel);
      border: 0;
      border-radius: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .score {
      font-weight: 700;
      font-size: 1rem;
    }
    button {
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #042f3a;
      padding: 8px 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .board {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(148, 163, 184, 0.22);
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      width: min(100%, calc(100dvh - 230px));
      aspect-ratio: 1;
      max-height: 100%;
      display: block;
      background: var(--grid);
    }
    .hint {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 0.88rem;
      text-align: center;
    }
    .hint kbd {
      background: rgba(148,163,184,0.14);
      border: 1px solid rgba(148,163,184,0.2);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 0.74rem;
    }

    .joystick {
      margin-top: 10px;
      width: 180px;
      align-self: center;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 8px;
      touch-action: manipulation;
      user-select: none;
    }
    .joy-btn {
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: rgba(15, 23, 42, 0.75);
      color: var(--text);
      border-radius: 8px;
      font-size: 1.35rem;
      font-weight: 700;
      height: 54px;
      padding: 0;
    }
    .joy-empty {
      pointer-events: none;
      background: transparent;
      border: 0;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <div class="score" id="score">Score: 0</div>
      <button id="restartBtn" type="button">Restart</button>
    </div>
    <div class="board">
      <canvas id="board" width="800" height="800" aria-label="Cyclist game board"></canvas>
    </div>
    <p class="hint">
      Move with <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>. Eat injections to grow your wheel trail.
    </p>
    <div id="joystick" class="joystick" role="group" aria-label="Joystick">
      <button class="joy-empty" type="button" aria-hidden="true"></button>
      <button class="joy-btn" data-dir="up" type="button" aria-label="Move up">▲</button>
      <button class="joy-empty" type="button" aria-hidden="true"></button>
      <button class="joy-btn" data-dir="left" type="button" aria-label="Move left">◀</button>
      <button class="joy-empty" type="button" aria-hidden="true"></button>
      <button class="joy-btn" data-dir="right" type="button" aria-label="Move right">▶</button>
      <button class="joy-empty" type="button" aria-hidden="true"></button>
      <button class="joy-btn" data-dir="down" type="button" aria-label="Move down">▼</button>
      <button class="joy-empty" type="button" aria-hidden="true"></button>
    </div>
  </main>

  <script>
    const board = document.getElementById("board");
    const ctx = board.getContext("2d");
    const scoreEl = document.getElementById("score");
    const restartBtn = document.getElementById("restartBtn");
    const joystick = document.getElementById("joystick");

    const GRID = 24;
    const TILE = board.width / GRID;
    const STEP_MS = 140;

    let cyclist;
    let dir;
    let qDir;
    let injection;
    let score;
    let dead;
    let loop;

    function randCell() {
      return { x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID) };
    }

    function placeInjection() {
      let c = randCell();
      while (cyclist.some(p => p.x === c.x && p.y === c.y)) c = randCell();
      injection = c;
    }

    function reset() {
      const c = Math.floor(GRID / 2);
      cyclist = [
        { x: c, y: c },
        { x: c - 1, y: c },
        { x: c - 2, y: c }
      ];
      dir = { x: 1, y: 0 };
      qDir = { ...dir };
      score = 0;
      dead = false;
      placeInjection();
      scoreEl.textContent = `Score: ${score}`;
      clearInterval(loop);
      loop = setInterval(step, STEP_MS);
      draw();
    }

    function opposite(a, b) {
      return a.x === -b.x && a.y === -b.y;
    }

    function queue(next) {
      if (dead || opposite(next, dir)) return;
      qDir = next;
    }

    function step() {
      if (dead) return;
      dir = qDir;
      const head = { x: cyclist[0].x + dir.x, y: cyclist[0].y + dir.y };
      const hitWall = head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID;
      const hitSelf = cyclist.some(p => p.x === head.x && p.y === head.y);

      if (hitWall || hitSelf) {
        dead = true;
        clearInterval(loop);
        scoreEl.textContent = `Game Over - Score: ${score}`;
        draw();
        return;
      }

      cyclist.unshift(head);

      if (head.x === injection.x && head.y === injection.y) {
        score += 1;
        scoreEl.textContent = `Score: ${score}`;
        placeInjection();
      } else {
        cyclist.pop();
      }

      draw();
    }

    function drawGrid() {
      ctx.strokeStyle = "rgba(148,163,184,0.08)";
      ctx.lineWidth = 1;
      for (let i = 0; i <= GRID; i++) {
        const p = i * TILE;
        ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, board.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(board.width, p); ctx.stroke();
      }
    }

    function drawInjection(cell) {
      const x = cell.x * TILE;
      const y = cell.y * TILE;
      const w = TILE;
      const h = TILE;
      ctx.save();
      ctx.translate(x + w / 2, y + h / 2);
      ctx.rotate(-Math.PI / 4);
      ctx.shadowColor = "rgba(244,63,94,0.7)";
      ctx.shadowBlur = 12;

      ctx.fillStyle = "#e2e8f0";
      ctx.fillRect(-w * 0.18, -h * 0.28, w * 0.36, h * 0.5);
      ctx.fillStyle = "#7dd3fc";
      ctx.fillRect(-w * 0.14, -h * 0.18, w * 0.28, h * 0.18);
      ctx.fillStyle = "#f43f5e";
      ctx.fillRect(-w * 0.04, -h * 0.12, w * 0.08, h * 0.36);

      ctx.strokeStyle = "#f1f5f9";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, -h * 0.36);
      ctx.lineTo(0, -h * 0.52);
      ctx.stroke();
      ctx.restore();
    }

    function drawWheel(seg, i) {
      const cx = seg.x * TILE + TILE / 2;
      const cy = seg.y * TILE + TILE / 2;
      const r = Math.max(4, TILE * 0.28 - i * 0.06);

      ctx.save();
      ctx.fillStyle = "#0f172a";
      ctx.strokeStyle = "#94a3b8";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.strokeStyle = "rgba(148,163,184,0.55)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(cx - r, cy);
      ctx.lineTo(cx + r, cy);
      ctx.moveTo(cx, cy - r);
      ctx.lineTo(cx, cy + r);
      ctx.stroke();
      ctx.restore();
    }

    function drawCyclistHead(head) {
      const cx = head.x * TILE + TILE / 2;
      const cy = head.y * TILE + TILE / 2;
      const r = TILE * 0.3;
      const helmet = "#22d3ee";

      ctx.save();
      ctx.fillStyle = helmet;
      ctx.beginPath();
      ctx.arc(cx, cy - r * 0.15, r, Math.PI, 0);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#f8fafc";
      ctx.beginPath();
      ctx.arc(cx, cy + r * 0.1, r * 0.7, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#0f172a";
      const ex = dir.x !== 0 ? dir.x * r * 0.2 : 0;
      const ey = dir.y !== 0 ? dir.y * r * 0.2 : 0;
      ctx.beginPath();
      ctx.arc(cx - r * 0.2 + ex, cy + ey, r * 0.11, 0, Math.PI * 2);
      ctx.arc(cx + r * 0.2 + ex, cy + ey, r * 0.11, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, board.width, board.height);
      drawGrid();

      drawInjection(injection);

      cyclist.forEach((seg, i) => {
        if (i === 0) return;
        drawWheel(seg, i);
      });
      drawCyclistHead(cyclist[0]);

      if (dead) {
        ctx.save();
        ctx.fillStyle = "rgba(2,6,23,0.58)";
        ctx.fillRect(0, 0, board.width, board.height);
        ctx.fillStyle = "#f43f5e";
        ctx.font = "900 56px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("CRASH", board.width / 2, board.height / 2);
        ctx.restore();
      }
    }

    document.addEventListener("keydown", e => {
      const k = e.key.toLowerCase();
      if (k === "arrowup" || k === "w") { queue({ x: 0, y: -1 }); e.preventDefault(); }
      if (k === "arrowdown" || k === "s") { queue({ x: 0, y: 1 }); e.preventDefault(); }
      if (k === "arrowleft" || k === "a") { queue({ x: -1, y: 0 }); e.preventDefault(); }
      if (k === "arrowright" || k === "d") { queue({ x: 1, y: 0 }); e.preventDefault(); }
    });

    restartBtn.addEventListener("click", reset);

    function handleJoystickDirection(dirName) {
      switch (dirName) {
        case "up":
          queue({ x: 0, y: -1 });
          break;
        case "down":
          queue({ x: 0, y: 1 });
          break;
        case "left":
          queue({ x: -1, y: 0 });
          break;
        case "right":
          queue({ x: 1, y: 0 });
          break;
        default:
          break;
      }
    }

    joystick.querySelectorAll(".joy-btn").forEach(btn => {
      btn.addEventListener("touchstart", e => {
        e.preventDefault();
        handleJoystickDirection(btn.dataset.dir);
      }, { passive: false });
      btn.addEventListener("click", e => {
        e.preventDefault();
        handleJoystickDirection(btn.dataset.dir);
      });
    });

    reset();
  </script>
</body>
</html>
