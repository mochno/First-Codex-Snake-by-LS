<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake — Neon Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050a18;
      --panel: rgba(10, 18, 40, 0.92);
      --grid: #080e20;
      --snake-head: #4ade80;
      --snake-tail: #065f26;
      --food: #f43f5e;
      --food-glow: rgba(244, 63, 94, 0.5);
      --accent: #22c55e;
      --accent-glow: rgba(34, 197, 94, 0.35);
      --text: #e2e8f0;
      --muted: #64748b;
      --gold: #fbbf24;
    }

    * { box-sizing: border-box; margin: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      overflow: hidden;
    }

    /* Animated background stars */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(1.5px 1.5px at 10% 20%, rgba(255,255,255,0.25) 50%, transparent 100%),
        radial-gradient(1px 1px at 30% 65%, rgba(255,255,255,0.15) 50%, transparent 100%),
        radial-gradient(1.5px 1.5px at 55% 15%, rgba(255,255,255,0.2) 50%, transparent 100%),
        radial-gradient(1px 1px at 70% 80%, rgba(255,255,255,0.18) 50%, transparent 100%),
        radial-gradient(1.5px 1.5px at 85% 40%, rgba(255,255,255,0.22) 50%, transparent 100%),
        radial-gradient(1px 1px at 15% 85%, rgba(255,255,255,0.12) 50%, transparent 100%),
        radial-gradient(1.5px 1.5px at 45% 45%, rgba(255,255,255,0.16) 50%, transparent 100%),
        radial-gradient(1px 1px at 90% 10%, rgba(255,255,255,0.2) 50%, transparent 100%),
        radial-gradient(ellipse at 30% 60%, rgba(34,197,94,0.06) 0%, transparent 60%),
        radial-gradient(ellipse at 70% 30%, rgba(59,130,246,0.05) 0%, transparent 60%);
      pointer-events: none;
      animation: drift 30s ease-in-out infinite alternate;
    }

    @keyframes drift {
      from { transform: translateY(0); }
      to { transform: translateY(-12px); }
    }

    .game-wrap {
      width: min(94vw, 500px);
      background: var(--panel);
      border: 1px solid rgba(148, 163, 184, 0.12);
      border-radius: 16px;
      padding: 20px;
      backdrop-filter: blur(12px);
      box-shadow:
        0 0 60px rgba(34,197,94,0.06),
        0 24px 48px rgba(0,0,0,0.4);
      position: relative;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 8px;
    }

    .scores {
      display: flex;
      gap: 16px;
      align-items: baseline;
    }

    .score-label {
      font-family: 'Orbitron', monospace;
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: 0.5px;
    }

    .score-value {
      color: var(--accent);
      text-shadow: 0 0 12px var(--accent-glow);
    }

    .hi-label {
      font-family: 'Orbitron', monospace;
      font-weight: 500;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.5px;
    }

    .hi-value { color: var(--gold); }

    button {
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #052e16;
      font-family: 'Orbitron', monospace;
      font-weight: 700;
      font-size: 0.7rem;
      letter-spacing: 1px;
      padding: 8px 14px;
      cursor: pointer;
      text-transform: uppercase;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 16px var(--accent-glow);
    }

    button:active { transform: scale(0.97); }

    .canvas-wrap {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(148, 163, 184, 0.1);
    }

    canvas {
      width: 100%;
      aspect-ratio: 1;
      display: block;
      background: var(--grid);
      image-rendering: auto;
    }

    /* Game over overlay */
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(5, 10, 24, 0.82);
      backdrop-filter: blur(6px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      border-radius: 10px;
    }

    .overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .overlay h2 {
      font-family: 'Orbitron', monospace;
      font-weight: 900;
      font-size: 1.8rem;
      color: var(--food);
      text-shadow: 0 0 24px rgba(244, 63, 94, 0.5);
      margin-bottom: 6px;
      letter-spacing: 2px;
    }

    .overlay .final-score {
      font-family: 'Orbitron', monospace;
      font-size: 1rem;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .overlay .final-score span {
      color: var(--accent);
    }

    .overlay button {
      font-size: 0.8rem;
      padding: 10px 24px;
    }

    .hint {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.8rem;
      text-align: center;
      letter-spacing: 0.3px;
    }

    .hint kbd {
      background: rgba(148,163,184,0.12);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Orbitron', monospace;
      font-size: 0.65rem;
      border: 1px solid rgba(148,163,184,0.15);
    }

    /* Floating score popup */
    .score-pop {
      position: absolute;
      font-family: 'Orbitron', monospace;
      font-weight: 900;
      font-size: 1.1rem;
      color: var(--accent);
      text-shadow: 0 0 8px var(--accent-glow);
      pointer-events: none;
      animation: popUp 0.7s ease-out forwards;
    }

    @keyframes popUp {
      0%   { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-40px) scale(1.3); }
    }

    /* Screen shake */
    .shake {
      animation: shakeAnim 0.35s ease-out;
    }

    @keyframes shakeAnim {
      0%, 100% { transform: translate(0); }
      15% { transform: translate(-6px, 3px); }
      30% { transform: translate(5px, -4px); }
      45% { transform: translate(-4px, 2px); }
      60% { transform: translate(3px, -2px); }
      75% { transform: translate(-2px, 1px); }
    }
  </style>
</head>
<body>
  <main class="game-wrap" id="gameWrap">
    <div class="top-bar">
      <div class="scores">
        <div class="score-label">
          <span class="score-value" id="score">0</span>
        </div>
        <div class="hi-label">
          HI <span class="hi-value" id="hiScore">0</span>
        </div>
      </div>
      <button id="restartBtn" type="button">Restart</button>
    </div>

    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="board" width="600" height="600" aria-label="Snake game board"></canvas>
      <div class="overlay" id="overlay">
        <h2>GAME OVER</h2>
        <div class="final-score">Score: <span id="finalScore">0</span></div>
        <button id="overlayRestart" type="button">Play Again</button>
      </div>
    </div>

    <p class="hint">
      <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to move &nbsp;·&nbsp; <kbd>Space</kbd> pause
    </p>
  </main>

  <script>
    /* ── Setup ─────────────────────────────────────── */
    const board   = document.getElementById("board");
    const ctx     = board.getContext("2d");
    const scoreEl = document.getElementById("score");
    const hiEl    = document.getElementById("hiScore");
    const overlay = document.getElementById("overlay");
    const finalEl = document.getElementById("finalScore");
    const wrap    = document.getElementById("canvasWrap");
    const gameWrap= document.getElementById("gameWrap");

    const GRID = 20;
    const TILE = board.width / GRID;
    const SPEED = 110;

    let snake, dir, qDir, food, score, hiScore = 0;
    let loopId, paused, dead;
    let particles = [];
    let foodPulse = 0;
    let animFrame;

    /* ── Particles ─────────────────────────────────── */
    function spawnParticles(x, y, color, count = 12) {
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 / count) * i + Math.random() * 0.4;
        const speed = 1.5 + Math.random() * 3;
        particles.push({
          x: x * TILE + TILE / 2,
          y: y * TILE + TILE / 2,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1,
          decay: 0.02 + Math.random() * 0.02,
          size: 2 + Math.random() * 3,
          color
        });
      }
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.96;
        p.vy *= 0.96;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function drawParticles() {
      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }

    /* ── Floating +1 ───────────────────────────────── */
    function showScorePop(cellX, cellY) {
      const pop = document.createElement("div");
      pop.className = "score-pop";
      pop.textContent = "+1";
      const rect = board.getBoundingClientRect();
      const scale = rect.width / board.width;
      pop.style.left = (cellX * TILE + TILE / 2) * scale + "px";
      pop.style.top  = (cellY * TILE) * scale + "px";
      wrap.appendChild(pop);
      pop.addEventListener("animationend", () => pop.remove());
    }

    /* ── Screen shake ──────────────────────────────── */
    function screenShake() {
      gameWrap.classList.add("shake");
      gameWrap.addEventListener("animationend", () => gameWrap.classList.remove("shake"), { once: true });
    }

    /* ── Helpers ────────────────────────────────────── */
    function randCell() {
      return { x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID) };
    }

    function placeFood() {
      let f = randCell();
      while (snake.some(s => s.x === f.x && s.y === f.y)) f = randCell();
      food = f;
    }

    /* ── Game logic ────────────────────────────────── */
    function reset() {
      snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      dir  = { x: 1, y: 0 };
      qDir = { ...dir };
      score = 0;
      paused = false;
      dead = false;
      particles = [];
      placeFood();
      overlay.classList.remove("visible");
      updateUI();
      clearInterval(loopId);
      loopId = setInterval(step, SPEED);
    }

    function updateUI() {
      scoreEl.textContent = score;
      if (score > hiScore) { hiScore = score; }
      hiEl.textContent = hiScore;
    }

    function opposite(a, b) { return a.x === -b.x && a.y === -b.y; }

    function queueDir(next) {
      if (dead || paused) return;
      if (opposite(next, dir)) return;
      qDir = next;
    }

    function step() {
      if (paused || dead) return;
      dir = qDir;

      let nd = { ...dir };
      let head = { x: snake[0].x + nd.x, y: snake[0].y + nd.y };

      const hitH = head.x < 0 || head.x >= GRID;
      const hitV = head.y < 0 || head.y >= GRID;

      if (hitH || hitV) {
        if (hitH) nd.x *= -1;
        if (hitV) nd.y *= -1;
        dir = nd;
        qDir = { ...nd };
        head = { x: snake[0].x + nd.x, y: snake[0].y + nd.y };
      }

      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        dead = true;
        clearInterval(loopId);
        screenShake();
        spawnParticles(head.x, head.y, "#f43f5e", 20);
        finalEl.textContent = score;
        setTimeout(() => overlay.classList.add("visible"), 350);
        updateUI();
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score++;
        spawnParticles(food.x, food.y, "#4ade80", 14);
        showScorePop(food.x, food.y);
        placeFood();
      } else {
        snake.pop();
      }
      updateUI();
    }

    /* ── Drawing ───────────────────────────────────── */
    function drawGrid() {
      ctx.strokeStyle = "rgba(148, 163, 184, 0.05)";
      ctx.lineWidth = 1;
      for (let i = 0; i <= GRID; i++) {
        const p = i * TILE;
        ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, board.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(board.width, p); ctx.stroke();
      }
    }

    function drawFood() {
      foodPulse += 0.06;
      const pulse = 1 + Math.sin(foodPulse) * 0.15;
      const cx = food.x * TILE + TILE / 2;
      const cy = food.y * TILE + TILE / 2;
      const r  = (TILE / 2 - 2) * pulse;

      // Outer glow
      ctx.save();
      ctx.shadowColor = "rgba(244, 63, 94, 0.6)";
      ctx.shadowBlur  = 18 + Math.sin(foodPulse) * 6;
      ctx.fillStyle   = "#f43f5e";
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Shine highlight
      ctx.save();
      ctx.fillStyle = "rgba(255,255,255,0.35)";
      ctx.beginPath();
      ctx.arc(cx - r * 0.25, cy - r * 0.3, r * 0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawSnake() {
      const len = snake.length;

      snake.forEach((seg, i) => {
        const t  = len > 1 ? i / (len - 1) : 0;
        const cx = seg.x * TILE + TILE / 2;
        const cy = seg.y * TILE + TILE / 2;

        // Interpolate head→tail color
        const r = Math.round(74 + (6 - 74) * t);
        const g = Math.round(222 + (95 - 222) * t);
        const b = Math.round(128 + (38 - 128) * t);
        const color = `rgb(${r},${g},${b})`;

        const radius = (TILE / 2 - 1) * (1 - t * 0.3); // taper towards tail

        ctx.save();
        if (i === 0) {
          ctx.shadowColor = "rgba(74,222,128,0.45)";
          ctx.shadowBlur  = 14;
        }
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // Connect segments with thick line for smooth body
      if (len > 1) {
        ctx.save();
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.lineWidth = TILE - 6;
        const grad = ctx.createLinearGradient(
          snake[0].x * TILE, snake[0].y * TILE,
          snake[len - 1].x * TILE, snake[len - 1].y * TILE
        );
        grad.addColorStop(0, "rgba(74,222,128,0.45)");
        grad.addColorStop(1, "rgba(6,95,38,0.2)");
        ctx.strokeStyle = grad;
        ctx.beginPath();
        ctx.moveTo(snake[0].x * TILE + TILE / 2, snake[0].y * TILE + TILE / 2);
        for (let i = 1; i < len; i++) {
          ctx.lineTo(snake[i].x * TILE + TILE / 2, snake[i].y * TILE + TILE / 2);
        }
        ctx.stroke();
        ctx.restore();
      }

      // Re-draw circles on top of the line
      snake.forEach((seg, i) => {
        const t  = len > 1 ? i / (len - 1) : 0;
        const cx = seg.x * TILE + TILE / 2;
        const cy = seg.y * TILE + TILE / 2;
        const r2 = Math.round(74 + (6 - 74) * t);
        const g2 = Math.round(222 + (95 - 222) * t);
        const b2 = Math.round(128 + (38 - 128) * t);
        const radius = (TILE / 2 - 1) * (1 - t * 0.3);
        ctx.fillStyle = `rgb(${r2},${g2},${b2})`;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fill();
      });

      // Eyes on head
      drawEyes(snake[0], dir);
    }

    function drawEyes(head, d) {
      const cx = head.x * TILE + TILE / 2;
      const cy = head.y * TILE + TILE / 2;
      const eyeOff = TILE * 0.22;
      const eyeR   = TILE * 0.13;
      const pupilR  = TILE * 0.065;

      // Perpendicular to direction
      const px = -d.y;
      const py = d.x;

      // Two eye positions
      const eyes = [
        { x: cx + px * eyeOff + d.x * eyeOff * 0.6, y: cy + py * eyeOff + d.y * eyeOff * 0.6 },
        { x: cx - px * eyeOff + d.x * eyeOff * 0.6, y: cy - py * eyeOff + d.y * eyeOff * 0.6 }
      ];

      eyes.forEach(e => {
        // White
        ctx.fillStyle = "#e8f5e9";
        ctx.beginPath();
        ctx.arc(e.x, e.y, eyeR, 0, Math.PI * 2);
        ctx.fill();
        // Pupil (shifted toward direction)
        ctx.fillStyle = "#0a2e12";
        ctx.beginPath();
        ctx.arc(e.x + d.x * pupilR * 1.2, e.y + d.y * pupilR * 1.2, pupilR, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    /* ── Render loop ───────────────────────────────── */
    function render() {
      ctx.clearRect(0, 0, board.width, board.height);

      // Subtle vignette
      const vig = ctx.createRadialGradient(
        board.width / 2, board.height / 2, board.width * 0.25,
        board.width / 2, board.height / 2, board.width * 0.7
      );
      vig.addColorStop(0, "transparent");
      vig.addColorStop(1, "rgba(0,0,0,0.3)");
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, board.width, board.height);

      drawGrid();
      drawFood();
      drawSnake();
      updateParticles();
      drawParticles();

      // Pause text
      if (paused && !dead) {
        ctx.save();
        ctx.fillStyle = "rgba(5,10,24,0.6)";
        ctx.fillRect(0, 0, board.width, board.height);
        ctx.font = "900 42px 'Orbitron', monospace";
        ctx.fillStyle = "#e2e8f0";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.shadowColor = "rgba(34,197,94,0.4)";
        ctx.shadowBlur = 20;
        ctx.fillText("PAUSED", board.width / 2, board.height / 2);
        ctx.restore();
      }

      animFrame = requestAnimationFrame(render);
    }

    /* ── Input ─────────────────────────────────────── */
    document.addEventListener("keydown", e => {
      const k = e.key.toLowerCase();
      if (k === "arrowup"    || k === "w") { queueDir({ x: 0, y: -1 }); e.preventDefault(); }
      if (k === "arrowdown"  || k === "s") { queueDir({ x: 0, y: 1  }); e.preventDefault(); }
      if (k === "arrowleft"  || k === "a") { queueDir({ x: -1, y: 0 }); e.preventDefault(); }
      if (k === "arrowright"  || k === "d") { queueDir({ x: 1, y: 0  }); e.preventDefault(); }
      if (k === " ") {
        e.preventDefault();
        if (!dead) { paused = !paused; }
      }
    });

    document.getElementById("restartBtn").addEventListener("click", reset);
    document.getElementById("overlayRestart").addEventListener("click", reset);

    /* ── Start ─────────────────────────────────────── */
    reset();
    render();
  </script>
</body>
</html>
